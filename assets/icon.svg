<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <!-- Outer dial circle -->
  <circle cx="12" cy="12" r="9.5" opacity="0.35" stroke-dasharray="2 2" />
  <!-- Solid outer ring segment indicating timeflow -->
  <path d="M12 2.5 A9.5 9.5 0 0 1 21.5 12" />
  <!-- Cardinal beat tick markers: @000 (top), @250 (right), @500 (bottom), @750 (left) -->
  <line x1="12" y1="2.5" x2="12" y2="4.5" stroke-width="2" />
  <line x1="21.5" y1="12" x2="19.5" y2="12" stroke-width="2" />
  <line x1="12" y1="21.5" x2="12" y2="19.5" stroke-width="2" />
  <line x1="2.5" y1="12" x2="4.5" y2="12" stroke-width="2" />
  <!-- Stylized '@' beat symbol in center -->
  <circle cx="11.5" cy="12" r="2.5" />
  <path d="M14 10.5 v3 c0 1.2 0.8 1.8 1.8 1.8 1.8 0 2.7-1.5 2.7-3.3 0-3.3-2.7-5.5-6.5-5.5 -4.1 0-7 3.1-7 7.2 0 4.1 3 7.3 7.2 7.3 2.5 0 4.5-1.1 5.5-2.8" />
